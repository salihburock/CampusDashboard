<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
  <script src="i18n.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="header-left">
      <h1 data-i18n="adm.title">Edit Dashboard</h1>
    </div>
    <div class="header-right">
      <button id="save-btn" class="btn-primary" onclick="saveData()" data-i18n="adm.save">Save</button>
      <a href="/" class="icon-btn" data-i18n-title="adm.back" title="← Dashboard">← Dashboard</a>
      <a href="/account" class="icon-btn" data-i18n-title="nav.account" title="Account">👤</a>
      <button class="icon-btn lang-toggle" onclick="toggleLang()" title="Switch language"></button>
      <button id="theme-toggle" class="icon-btn" title="Toggle dark mode">☾</button>
    </div>
  </header>

  <main class="container admin-main">

    <!-- Semesters -->
    <div class="admin-card">
      <div class="admin-card-header">
        <h2 data-i18n="sem.title">Semesters</h2>
        <button onclick="openNewSemester()" class="btn-primary btn-sm" data-i18n="sem.new">+ New Semester</button>
      </div>
      <div class="semester-bar">
        <select id="semester-select" class="field-select" onchange="switchSemester(this.value)"></select>
        <span id="semester-status" class="semester-status"></span>
        <div class="semester-actions">
          <button id="sem-activate" onclick="activateSemester()" class="btn-secondary btn-sm" data-i18n="sem.make_active">Make Active</button>
          <button id="sem-archive" onclick="toggleArchiveSemester()" class="btn-secondary btn-sm" data-i18n="sem.archive">Archive</button>
          <button onclick="renameSemester()" class="btn-secondary btn-sm" data-i18n="sem.rename">Rename</button>
          <button id="sem-delete" onclick="deleteSemester()" class="btn-danger btn-sm" data-i18n="sem.delete">Delete</button>
        </div>
      </div>
    </div>

    <!-- Dashboard Title -->
    <div class="admin-card">
      <label class="field-label" for="dashboard-title" data-i18n="adm.dash_title">Dashboard Title</label>
      <input id="dashboard-title" type="text" class="field-input"
             placeholder="e.g. My Dashboard"
             oninput="state.title = this.value">
    </div>

    <!-- Sections -->
    <div class="admin-card">
      <div class="admin-card-header">
        <h2 data-i18n="adm.sections">Sections</h2>
      </div>
      <div id="sections-container"></div>
      <button onclick="addSection()" class="btn-secondary" data-i18n="adm.add_section">+ Add Section</button>
    </div>

    <!-- PDF / Document Library -->
    <div class="admin-card">
      <div class="admin-card-header">
        <h2 data-i18n="adm.doc_lib">Document Library</h2><label class="btn-secondary btn-sm" style="cursor:pointer" title="Upload a PDF document"><span style="font-size:1.2rem;vertical-align:middle;margin-right:2px">+</span> Upload PDF<input id="manual-pdf-upload" type="file" accept=".pdf" style="display:none" onchange="handleManualUpload(this)"></label>
        <label class="btn-secondary btn-sm" style="cursor:pointer" title="Import a Moodle course ZIP archive">
          📦 Import Moodle ZIP
          <input id="moodle-zip-input" type="file" accept=".zip" style="display:none"
                 onchange="handleMoodleZipSelected(this)">
        </label>
      </div>
      <p style="font-size:.8rem;color:var(--muted);margin:.25rem 0 .75rem">
        Drag &amp; drop files anywhere on this page to upload and name them.
      </p>
      <div id="pdf-list"></div>
    </div>

    <!-- New Semester Modal -->
    <div id="semester-modal" class="moodle-modal-backdrop hidden">
      <div class="moodle-modal-box" style="width:min(94vw,440px)">
        <div class="moodle-modal-header">
          <h3 data-i18n="sem.new">New Semester</h3>
          <button class="icon-btn" onclick="closeSemesterModal()">✕</button>
        </div>
        <div class="moodle-modal-body">
          <label class="field-label-sm" data-i18n="sem.name_label">Semester name</label>
          <input id="sem-name-input" class="field-input" type="text"
                 onkeydown="if(event.key==='Enter')confirmNewSemester()">
          <label class="toggle-label" style="margin-top:.75rem">
            <input type="checkbox" id="sem-archive-current" checked>
            <span data-i18n="sem.archive_current">Archive the current semester</span>
          </label>
        </div>
        <div class="moodle-import-bar">
          <button class="btn-primary btn-sm" onclick="confirmNewSemester()" data-i18n="sem.create">Create</button>
          <button class="btn-secondary btn-sm" onclick="closeSemesterModal()" data-i18n="sem.cancel">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Moodle Import Modal -->
    <div id="moodle-modal" class="moodle-modal-backdrop hidden">
      <div class="moodle-modal-box">
        <div class="moodle-modal-header">
          <h3 id="moodle-modal-title">Moodle Import</h3>
          <button class="icon-btn" onclick="closeMoodleModal()">✕</button>
        </div>
        <div id="moodle-modal-body" class="moodle-modal-body"></div>
      </div>
    </div>

  </main>

  <div id="toast" class="toast"></div>

  <script src="admin.js"></script>
  <script src="upload-overlay.js"></script>
</body>
</html>
