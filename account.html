<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account - Campus Dashboard</title>
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    .account-container {
      max-width: 520px;
      margin: 2.5rem auto;
      padding: 0 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .account-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
    }
    .account-card h2 {
      margin: 0 0 1rem;
      font-size: .8rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .username-display {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
    }
    .field { margin-bottom: 1rem; }
    .field label {
      display: block;
      font-size: .85rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: .4rem;
    }
    .field input {
      width: 100%;
      padding: .65rem .8rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: .95rem;
      background: var(--surface);
      color: var(--text);
      font-family: var(--font);
      transition: border-color .15s, box-shadow .15s;
    }
    .field input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }
    .btn-save {
      width: 100%;
      padding: .75rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: .5rem;
      transition: opacity .15s;
    }
    .btn-save:hover { opacity: .88; }
    .btn-save:disabled { opacity: .55; cursor: default; }
    .msg {
      font-size: .85rem;
      text-align: center;
      margin-top: .75rem;
      padding: .55rem;
      border-radius: 8px;
      display: none;
    }
    .msg.ok  { background: #e6f7ec; color: var(--ok); }
    .msg.err { background: #fde8ea; color: var(--danger); }
    [data-theme="dark"] .msg.ok  { background: #0f2d1a; }
    [data-theme="dark"] .msg.err { background: #3a1a1d; }
    .btn-logout {
      width: 100%;
      padding: .75rem;
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      border-radius: 8px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .btn-logout:hover { background: var(--danger); color: #fff; }
    /* Share link card */
    .share-hint {
      font-size: .82rem;
      color: var(--muted);
      margin: 0 0 .75rem;
      line-height: 1.5;
    }
    .share-row {
      display: flex;
      gap: .5rem;
      align-items: center;
    }
    .share-input {
      flex: 1;
      padding: .6rem .7rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: .8rem;
      background: var(--bg);
      color: var(--accent);
      font-weight: 600;
      min-width: 0;
    }
    .share-input:focus { outline: none; border-color: var(--accent); }
    .btn-copy {
      padding: .6rem 1rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: opacity .15s;
    }
    .btn-copy:hover { opacity: .88; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-left">
      <h1 data-i18n="acct.title">Account</h1>
    </div>
    <div class="header-right">
      <a href="/" class="icon-btn" data-i18n-title="acct.back" title="← Dashboard">← Dashboard</a>
      <button class="icon-btn lang-toggle" onclick="toggleLang()" title="Switch language"></button>
      <button id="theme-toggle" class="icon-btn" title="Toggle dark mode">☾</button>
    </div>
  </header>

  <div class="account-container">

    <div class="account-card">
      <h2 data-i18n="acct.profile">Profile</h2>
      <div class="username-display" id="display-username">—</div>
    </div>

    <div class="account-card" id="share-card" style="display:none">
      <h2 data-i18n="acct.share_title">Share Link</h2>
      <p class="share-hint" data-i18n="acct.share_hint">Visitors with this link can also see your unlisted sections.</p>
      <div class="share-row">
        <input type="text" id="share-url" class="share-input" readonly>
        <button id="copy-btn" class="btn-copy" onclick="copyLink()" data-i18n="acct.copy">Copy</button>
      </div>
    </div>

    <div class="account-card">
      <h2 data-i18n="acct.change_pw">Change Password</h2>
      <form id="pw-form">
        <div class="field">
          <label data-i18n="acct.cur_pw">Current password</label>
          <input type="password" id="cur-pw" autocomplete="current-password" required>
        </div>
        <div class="field">
          <label>
            <span data-i18n="acct.new_pw">New password</span>
            <span style="font-weight:400;color:var(--muted)" data-i18n="acct.new_pw_hint">(min 6 chars)</span>
          </label>
          <input type="password" id="new-pw" autocomplete="new-password" required minlength="6">
        </div>
        <div class="field">
          <label data-i18n="acct.confirm_pw">Confirm new password</label>
          <input type="password" id="new-pw2" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn-save" id="save-btn" data-i18n="acct.save_pw">Save Password</button>
        <div class="msg" id="pw-msg"></div>
      </form>
    </div>

    <div class="account-card">
      <a href="/auth/logout" class="btn-logout" style="display:block;text-align:center;text-decoration:none" data-i18n="acct.logout">Logout</a>
    </div>

  </div>

  <script>
    (function() {
      const btn = document.getElementById('theme-toggle');
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved ? saved === 'dark' : prefersDark;
      function apply(dark) {
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        btn.textContent = dark ? '☀' : '☾';
        localStorage.setItem('theme', dark ? 'dark' : 'light');
      }
      apply(isDark);
      btn.addEventListener('click', () => apply(document.documentElement.getAttribute('data-theme') !== 'dark'));
    })();

    (async () => {
      const res = await fetch('/auth/me');
      const me = await res.json();
      document.getElementById('display-username').textContent = me.username;
    })();

    (async () => {
      try {
        const res = await fetch('/api/share-info');
        if (!res.ok) return;
        const data = await res.json();
        document.getElementById('share-url').value = data.url;
        document.getElementById('share-card').style.display = '';
      } catch {}
    })();

    function copyFeedback() {
      const btn = document.getElementById('copy-btn');
      btn.textContent = t('acct.copied');
      setTimeout(() => { btn.textContent = t('acct.copy'); }, 2000);
    }

    function fallbackCopy(input) {
      // Works over plain HTTP / LAN where navigator.clipboard is unavailable
      input.removeAttribute('readonly');
      input.focus();
      input.select();
      input.setSelectionRange(0, 99999);
      let ok = false;
      try { ok = document.execCommand('copy'); } catch { ok = false; }
      input.setAttribute('readonly', '');
      input.blur();
      if (ok) copyFeedback();
    }

    function copyLink() {
      const input = document.getElementById('share-url');
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(input.value)
          .then(copyFeedback)
          .catch(() => fallbackCopy(input));
      } else {
        fallbackCopy(input);
      }
    }

    document.getElementById('pw-form').onsubmit = async (e) => {
      e.preventDefault();
      const msgEl = document.getElementById('pw-msg');
      const newPw = document.getElementById('new-pw').value;
      const newPw2 = document.getElementById('new-pw2').value;

      if (newPw !== newPw2) {
        msgEl.textContent = t('acct.pw_mismatch');
        msgEl.className = 'msg err';
        msgEl.style.display = 'block';
        return;
      }

      const btn = document.getElementById('save-btn');
      btn.disabled = true;
      btn.textContent = t('acct.saving');

      try {
        const res = await fetch('/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            currentPassword: document.getElementById('cur-pw').value,
            newPassword: newPw
          })
        });
        const data = await res.json();
        if (res.ok) {
          msgEl.textContent = t('acct.pw_ok');
          msgEl.className = 'msg ok';
          document.getElementById('pw-form').reset();
        } else {
          const key = data.error && data.error.toLowerCase().includes('incorrect') ? 'acct.pw_wrong' : 'acct.pw_fail';
          msgEl.textContent = data.error || t(key);
          msgEl.className = 'msg err';
        }
      } catch {
        msgEl.textContent = t('acct.pw_fail');
        msgEl.className = 'msg err';
      } finally {
        msgEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = t('acct.save_pw');
      }
    };
  </script>

</body>
</html>
